<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phần mềm Python CALFEM Phân tích Phi tuyến Hình học Hệ Dàn 2D/3D — ĐH Bách Khoa TP.HCM">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CALFEM Python 2D/3D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CALFEM Python Studio — Phân tích Phi tuyến Hình học 2D/3D</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #070D19; color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #calfem-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #0F2342 0%, #070D19 75%);
      transition: opacity 0.35s ease;
    }
    #calfem-loader img {
      width: 78px; height: 78px; border-radius: 18px;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.35);
      margin-bottom: 18px;
    }
    .loader-title {
      font-size: 18px; font-weight: 700; color: #F8FAFC; margin-bottom: 6px; text-align: center;
    }
    .loader-sub {
      font-size: 13px; color: #38BDF8; margin-bottom: 18px; text-align: center;
    }
    .loader-ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.22);
      border-top-color: #38BDF8;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="calfem-loader">
    <img src="icons/Icon-192.png" alt="Python CALFEM">
    <div class="loader-title">CALFEM Python Studio — Phân tích Phi tuyến Hình học 2D/3D</div>
    <div class="loader-sub">Giảng viên hướng dẫn: PGS. TS Ngô Hữu Cường<br>Đang khởi động lõi tính toán &amp; không gian mô phỏng 3D...</div>
    <div class="loader-ring"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('calfem-loader');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 380); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
